name: Audit PHPStan

on:
  push:
    branches:
      - fix/auditoria-20260914

jobs:
  phpstan-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_sqlite, pdo_mysql, pdo_pgsql
          tools: composer
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Capture PHPStan report
        shell: bash
        run: |
          set +e
          vendor/bin/phpstan analyse app database index.php --level=7 --no-progress --error-format=table > AUDIT-PHPSTAN.txt 2>&1
          STATUS=$?
          echo "PHPStan exit code: $STATUS" >> AUDIT-PHPSTAN.txt
          exit 0
      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: phpstan-audit-${{ github.sha }}
          path: AUDIT-PHPSTAN.txt
          if-no-files-found: error
          retention-days: 3
