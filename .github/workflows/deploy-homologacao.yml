name: Deploy Show de Premios - Homologacao

on:
  push:
    branches: [homologacao]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  HOMOLOG_HOST: showdepremios-hml.77-37-40-81.sslip.io

concurrency:
  group: show-de-premios-homologacao
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    name: Validar e publicar homologacao isolada
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v5

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_sqlite, pdo_mysql, pdo_pgsql
          tools: composer

      - name: Instalar dependencias
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Validar dependencias
        run: composer audit --no-interaction

      - name: Validar sintaxe PHP
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do php -l "$file"; done < <(git ls-files '*.php')

      - name: Executar testes
        run: vendor/bin/phpunit -c phpunit.xml --no-coverage

      - name: Validar imagem Docker
        run: docker build -t show-de-premios-homologacao:${{ github.sha }} .

      - name: Criar pacote isolado
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_DIR="$(mktemp -d)"
          rsync -av \
            --exclude 'storage/' \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.env' \
            --exclude 'deploy_key' \
            --exclude 'deploy_key.pub' \
            ./ "$RELEASE_DIR/"
          tar -czf release-showdepremios-homologacao.tar.gz -C "$RELEASE_DIR" .
          rm -rf "$RELEASE_DIR"

      - name: Transferir release para VPS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.HOSTINGER_IP || '77.37.40.81' }}
          username: ${{ secrets.HOSTINGER_USER || 'root' }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          timeout: "120s"
          command_timeout: "10m"
          source: "release-showdepremios-homologacao.tar.gz"
          target: "/tmp"
          overwrite: true

      - name: Implantar homologacao isolada
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOSTINGER_IP || '77.37.40.81' }}
          username: ${{ secrets.HOSTINGER_USER || 'root' }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          timeout: "120s"
          command_timeout: "20m"
          script: |
            set -eu
            APP_DIR=/app/show-de-premios-homologacao
            STORAGE_DIR="$APP_DIR/storage"
            IMAGE_NEW=showdepremios-homologacao:candidate
            IMAGE_LATEST=showdepremios-homologacao:latest
            IMAGE_ROLLBACK=showdepremios-homologacao:rollback
            CONTAINER=showdepremios-homologacao
            PORT=18080
            PROXY_CONTAINER=sgr-proxy-prod
            PROD_APP=showdepremios-app
            HOMOLOG_HOST=showdepremios-hml.77-37-40-81.sslip.io

            mkdir -p "$APP_DIR" "$STORAGE_DIR/logs" "$STORAGE_DIR/backups" "$STORAGE_DIR/rate-limit"
            mv -f /tmp/release-showdepremios-homologacao.tar.gz "$APP_DIR/"
            cd "$APP_DIR"
            tar -xzf release-showdepremios-homologacao.tar.gz
            rm -f release-showdepremios-homologacao.tar.gz
            chmod -R 775 "$STORAGE_DIR"
            chown -R 33:33 "$STORAGE_DIR" || true

            NET=''
            PROXY_NETS=$(docker inspect -f '{{range $name, $cfg := .NetworkSettings.Networks}}{{println $name}}{{end}}' "$PROXY_CONTAINER" 2>/dev/null || true)
            PROD_NETS=$(docker inspect -f '{{range $name, $cfg := .NetworkSettings.Networks}}{{println $name}}{{end}}' "$PROD_APP" 2>/dev/null || true)
            for candidate in $PROXY_NETS; do
              if printf '%s\n' "$PROD_NETS" | grep -Fxq "$candidate"; then
                NET="$candidate"
                break
              fi
            done
            if [ -z "$NET" ]; then
              NET=$(printf '%s\n' "$PROXY_NETS" | grep -Ev '^(bridge|host|none)$' | head -n 1 || true)
            fi
            if [ -z "$NET" ]; then
              echo 'ERRO: rede Docker compartilhada com o proxy nao encontrada.'
              exit 1
            fi
            echo "Rede compartilhada proxy/app: $NET"

            OLD_IMAGE=$(docker inspect -f '{{.Image}}' "$CONTAINER" 2>/dev/null || true)
            if [ -n "$OLD_IMAGE" ]; then docker tag "$OLD_IMAGE" "$IMAGE_ROLLBACK" || true; fi

            docker build -t "$IMAGE_NEW" .

            docker run --rm \
              -v "$STORAGE_DIR:/var/www/html/showdepremios/storage" \
              "$IMAGE_NEW" php bin/migrate.php

            docker rm -f "$CONTAINER" >/dev/null 2>&1 || true
            docker tag "$IMAGE_NEW" "$IMAGE_LATEST"
            docker run -d \
              --name "$CONTAINER" \
              --restart always \
              --network "$NET" \
              --network-alias showdepremios-homologacao \
              -p "$PORT:80" \
              -e APP_ENV=homologacao \
              -v "$STORAGE_DIR:/var/www/html/showdepremios/storage" \
              "$IMAGE_LATEST"

            ONLINE=0
            for i in $(seq 1 15); do
              if curl --fail --silent --show-error --max-time 10 "http://127.0.0.1:$PORT/api/ping" >/dev/null; then
                ONLINE=1
                break
              fi
              sleep 3
            done
            if [ "$ONLINE" -ne 1 ]; then
              echo 'Falha no health-check local da homologacao. Iniciando rollback.'
              docker logs --tail 150 "$CONTAINER" || true
              docker rm -f "$CONTAINER" || true
              if docker image inspect "$IMAGE_ROLLBACK" >/dev/null 2>&1; then
                docker run -d \
                  --name "$CONTAINER" \
                  --restart always \
                  --network "$NET" \
                  --network-alias showdepremios-homologacao \
                  -p "$PORT:80" \
                  -e APP_ENV=homologacao \
                  -v "$STORAGE_DIR:/var/www/html/showdepremios/storage" \
                  "$IMAGE_ROLLBACK"
              fi
              exit 1
            fi

            echo 'Validando resolucao e acesso ao backend pela rede do proxy...'
            docker run --rm --network "$NET" "$IMAGE_LATEST" php -r '$u="http://showdepremios-homologacao/api/ping"; $r=@file_get_contents($u); if ($r===false) {fwrite(STDERR,"backend indisponivel\n"); exit(1);} echo $r, PHP_EOL;'

            echo 'Configurando acesso publico da homologacao no Caddy...'
            CADDY_DEST=/etc/caddy/Caddyfile
            CADDY_SOURCE=$(docker inspect -f '{{range .Mounts}}{{if eq .Destination "/etc/caddy/Caddyfile"}}{{.Source}}{{end}}{{end}}' "$PROXY_CONTAINER" 2>/dev/null || true)
            if [ -n "$CADDY_SOURCE" ] && [ -f "$CADDY_SOURCE" ]; then
              CADDY_FILE="$CADDY_SOURCE"
            else
              CADDY_FILE=/tmp/Caddyfile.showdepremios-homologacao
              docker cp "$PROXY_CONTAINER:$CADDY_DEST" "$CADDY_FILE"
            fi

            TMP_FILE="${CADDY_FILE}.tmp"
            sed '/# BEGIN SHOWDEPREMIOS HOMOLOGACAO/,/# END SHOWDEPREMIOS HOMOLOGACAO/d' "$CADDY_FILE" > "$TMP_FILE"
            printf '\n# BEGIN SHOWDEPREMIOS HOMOLOGACAO\n%s {\n    reverse_proxy showdepremios-homologacao:80\n}\n# END SHOWDEPREMIOS HOMOLOGACAO\n' "$HOMOLOG_HOST" >> "$TMP_FILE"
            mv "$TMP_FILE" "$CADDY_FILE"

            if [ -z "$CADDY_SOURCE" ]; then
              docker cp "$CADDY_FILE" "$PROXY_CONTAINER:$CADDY_DEST"
            fi

            docker exec "$PROXY_CONTAINER" caddy validate --config "$CADDY_DEST"
            docker exec "$PROXY_CONTAINER" caddy reload --config "$CADDY_DEST"

            echo "HOMOLOGACAO PUBLICADA EM https://$HOMOLOG_HOST"
            docker image rm "$IMAGE_ROLLBACK" >/dev/null 2>&1 || true

      - name: Validar homologacao pela Internet
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 24); do
            if curl --fail --silent --show-error --location --max-time 15 "https://${HOMOLOG_HOST}/api/ping"; then
              echo
              echo "Homologacao acessivel publicamente: https://${HOMOLOG_HOST}"
              exit 0
            fi
            echo "Aguardando HTTPS/Caddy ($i/24)..."
            sleep 5
          done
          echo 'ERRO: homologacao nao ficou acessivel publicamente.'
          exit 1
