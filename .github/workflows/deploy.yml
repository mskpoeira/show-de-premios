name: Deploy Show de Prêmios

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: show-de-premios-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy isolado do Show de Prêmios
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Validar sintaxe PHP
        run: |
          find app database bin -name "*.php" -exec php -l {} +
          php -l index.php
          php -l fire-test.php

      - name: Criar release
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_DIR="$(mktemp -d)"
          rsync -av             --exclude 'storage/'             --exclude '.git/'             --exclude '.github/'             --exclude '.env'             ./ "$RELEASE_DIR/"
          tar -czf release-showdepremios.tar.gz -C "$RELEASE_DIR" .
          rm -rf "$RELEASE_DIR"

      - name: Transferir release
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.HOSTINGER_IP }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "release-showdepremios.tar.gz"
          target: "/tmp"
          overwrite: true

      - name: Publicar runtime exclusivo
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOSTINGER_IP }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: "20m"
          timeout: "120s"
          script: |
            set -eu
            APP_DIR=/app/show-de-premios
            STORAGE_DIR="$APP_DIR/storage"
            CANDIDATE_STORAGE="$APP_DIR/storage-candidate"
            NETWORK=showdepremios
            BIND=${SHOW_DE_PREMIOS_BIND:-127.0.0.1:38080}
            IMAGE_NEW=showdepremios-app:candidate
            IMAGE_LATEST=showdepremios-app:latest
            IMAGE_ROLLBACK=showdepremios-app:rollback
            CONTAINER=showdepremios-app
            CANDIDATE=showdepremios-candidate
            DB_BACKUP=''

            mkdir -p "$APP_DIR" "$STORAGE_DIR/logs" "$STORAGE_DIR/backups" "$STORAGE_DIR/rate-limit"
            mv -f /tmp/release-showdepremios.tar.gz "$APP_DIR/"
            cd "$APP_DIR"
            tar -xzf release-showdepremios.tar.gz
            rm -f release-showdepremios.tar.gz

            chown -R 33:33 "$STORAGE_DIR" || true
            chmod -R 775 "$STORAGE_DIR"
            docker network inspect "$NETWORK" >/dev/null 2>&1 || docker network create "$NETWORK" >/dev/null

            OLD_IMAGE=$(docker inspect -f '{{.Image}}' "$CONTAINER" 2>/dev/null || true)
            if [ -n "$OLD_IMAGE" ]; then docker tag "$OLD_IMAGE" "$IMAGE_ROLLBACK" || true; fi

            docker build -t "$IMAGE_NEW" .

            rm -rf "$CANDIDATE_STORAGE"
            mkdir -p "$CANDIDATE_STORAGE/logs" "$CANDIDATE_STORAGE/backups" "$CANDIDATE_STORAGE/rate-limit"
            if [ -f "$STORAGE_DIR/database.sqlite" ]; then
              cp -p "$STORAGE_DIR/database.sqlite" "$CANDIDATE_STORAGE/database.sqlite"
            fi
            chown -R 33:33 "$CANDIDATE_STORAGE" || true
            chmod -R 775 "$CANDIDATE_STORAGE"

            docker rm -f "$CANDIDATE" >/dev/null 2>&1 || true
            docker run -d --name "$CANDIDATE" --network "$NETWORK"               -v "$CANDIDATE_STORAGE:/var/www/html/showdepremios/storage" "$IMAGE_NEW"

            sleep 4
            docker exec "$CANDIDATE" php bin/migrate.php
            docker exec "$CANDIDATE" php -r '$r=@file_get_contents("http://127.0.0.1/api/ping"); if ($r===false) exit(1);'
            docker rm -f "$CANDIDATE"
            rm -rf "$CANDIDATE_STORAGE"

            if [ -f "$STORAGE_DIR/database.sqlite" ]; then
              DB_BACKUP="$STORAGE_DIR/backups/predeploy-$(date +%Y%m%d-%H%M%S).sqlite"
              cp -p "$STORAGE_DIR/database.sqlite" "$DB_BACKUP"
            fi

            if docker inspect "$CONTAINER" >/dev/null 2>&1; then
              docker stop "$CONTAINER" >/dev/null 2>&1 || true
            fi

            if ! docker run --rm --network "$NETWORK"               -v "$STORAGE_DIR:/var/www/html/showdepremios/storage"               "$IMAGE_NEW" php bin/migrate.php; then
              if [ -n "$DB_BACKUP" ] && [ -f "$DB_BACKUP" ]; then
                cp -p "$DB_BACKUP" "$STORAGE_DIR/database.sqlite"
                chown 33:33 "$STORAGE_DIR/database.sqlite" || true
              fi
              docker start "$CONTAINER" >/dev/null 2>&1 || true
              exit 1
            fi

            docker tag "$IMAGE_NEW" "$IMAGE_LATEST"
            docker rm -f "$CONTAINER" >/dev/null 2>&1 || true
            docker run -d               --name "$CONTAINER"               --restart always               --network "$NETWORK"               -p "$BIND:80"               -v "$STORAGE_DIR:/var/www/html/showdepremios/storage"               "$IMAGE_LATEST"

            ONLINE=0
            for i in $(seq 1 20); do
              if docker exec "$CONTAINER" php -r '$r=@file_get_contents("http://127.0.0.1/api/ping"); if ($r===false) exit(1);'; then
                ONLINE=1
                break
              fi
              sleep 2
            done

            if [ "$ONLINE" -eq 1 ]; then
              docker image rm "$IMAGE_ROLLBACK" >/dev/null 2>&1 || true
              echo "SHOW_DE_PREMIOS_RUNTIME=OK"
              exit 0
            fi

            docker rm -f "$CONTAINER" >/dev/null 2>&1 || true
            if docker image inspect "$IMAGE_ROLLBACK" >/dev/null 2>&1; then
              docker run -d                 --name "$CONTAINER"                 --restart always                 --network "$NETWORK"                 -p "$BIND:80"                 -v "$STORAGE_DIR:/var/www/html/showdepremios/storage"                 "$IMAGE_ROLLBACK"
            fi
            exit 1
