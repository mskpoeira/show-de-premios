name: Deploy Show de Prêmios para Produção

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Hostinger VPS (showdepremios.mskpoeira.com.br)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Chave SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Sincronizar Arquivos para o Servidor Hostinger
        run: |
          rsync -avz --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.env' \
            --exclude 'storage/*.sqlite*' \
            --exclude 'storage/backups/' \
            --exclude 'storage/logs/*.log' \
            --exclude 'node_modules/' \
            --exclude 'vendor/' \
            ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/var/www/show-de-premios/

      - name: Executar Migrações e Ajustar Permissões
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} '
            chown -R www-data:www-data /var/www/show-de-premios
            chmod -R 775 /var/www/show-de-premios/storage
            systemctl reload php8.2-fpm || true
            systemctl reload caddy || true
          '
