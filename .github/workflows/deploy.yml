name: Deploy Show de Prêmios para Produção

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy-showdepremios:
    name: Deploy Show de Prêmios (Hostinger VPS - Isolado)
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Validar sintaxe PHP
        run: |
          find app database -name "*.php" -exec php -l {} +
          php -l index.php

      - name: Criar pacote de release isolado
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_DIR="$(mktemp -d)"
          rsync -av \
            --exclude 'storage/' \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.env' \
            --exclude 'deploy_key' \
            --exclude 'deploy_key.pub' \
            --exclude 'showdepremios_release/' \
            --exclude 'release-showdepremios.tar.gz' \
            ./ "$RELEASE_DIR/"
          tar -czf release-showdepremios.tar.gz -C "$RELEASE_DIR" .
          rm -rf "$RELEASE_DIR"

      - name: Transferir release para o servidor
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.HOSTINGER_IP || '77.37.40.81' }}
          username: ${{ secrets.HOSTINGER_USER || 'root' }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          timeout: "120s"
          command_timeout: "10m"
          source: "release-showdepremios.tar.gz"
          target: "/tmp"
          overwrite: true

      - name: Instalar e rodar Show de Prêmios isolado no VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOSTINGER_IP || '77.37.40.81' }}
          username: ${{ secrets.HOSTINGER_USER || 'root' }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: "20m"
          timeout: "120s"
          script: |
            set -eu
            APP_DIR=/app/show-de-premios
            STORAGE_DIR="$APP_DIR/storage"
            IMAGE_NEW=showdepremios-app:candidate
            IMAGE_LATEST=showdepremios-app:latest
            IMAGE_ROLLBACK=showdepremios-app:rollback
            CONTAINER=showdepremios-app
            CANDIDATE=showdepremios-candidate
            PROXY_CONTAINER=sgr-proxy-prod

            echo '=================================================='
            echo 'DEPLOY SHOW DE PRÊMIOS'
            echo '=================================================='

            mkdir -p "$APP_DIR"
            mv -f /tmp/release-showdepremios.tar.gz "$APP_DIR/"
            cd "$APP_DIR"

            echo 'Extraindo release...'
            tar -xzf release-showdepremios.tar.gz
            rm -f release-showdepremios.tar.gz

            mkdir -p storage/logs storage/backups
            chmod -R 775 storage
            chown -R 33:33 storage || true

            echo 'Detectando rede real do proxy Caddy...'
            NET=''
            if docker inspect "$PROXY_CONTAINER" >/dev/null 2>&1; then
              NET=$(docker inspect -f '{{range $name, $cfg := .NetworkSettings.Networks}}{{println $name}}{{end}}' "$PROXY_CONTAINER" | grep -Ev '^(bridge|host|none)$' | head -n 1 || true)
            fi

            if [ -z "$NET" ]; then
              echo 'ERRO: não foi encontrada rede Docker user-defined ligada ao proxy sgr-proxy-prod.'
              echo 'Redes do proxy:'
              docker inspect -f '{{range $name, $cfg := .NetworkSettings.Networks}}{{println $name}}{{end}}' "$PROXY_CONTAINER" 2>/dev/null || true
              echo 'Redes disponíveis:'
              docker network ls || true
              exit 1
            fi
            echo "Rede do proxy: $NET"

            echo 'Preservando imagem anterior para rollback...'
            OLD_IMAGE=$(docker inspect -f '{{.Image}}' "$CONTAINER" 2>/dev/null || true)
            if [ -n "$OLD_IMAGE" ]; then
              docker tag "$OLD_IMAGE" "$IMAGE_ROLLBACK" || true
            fi

            echo 'Construindo nova imagem...'
            docker build -t "$IMAGE_NEW" .

            echo 'Subindo candidato sem alterar a rota pública...'
            docker rm -f "$CANDIDATE" >/dev/null 2>&1 || true
            docker run -d \
              --name "$CANDIDATE" \
              --network "$NET" \
              -v "$STORAGE_DIR:/var/www/html/showdepremios/storage" \
              "$IMAGE_NEW"

            sleep 5
            if ! docker exec "$CANDIDATE" php -r '$r=@file_get_contents("http://127.0.0.1/"); if ($r===false) { exit(1); }'; then
              echo 'Candidato não respondeu internamente. Mantendo produção anterior.'
              docker logs --tail 120 "$CANDIDATE" || true
              docker rm -f "$CANDIDATE" || true
              exit 1
            fi
            docker rm -f "$CANDIDATE" || true

            echo 'Promovendo nova imagem...'
            docker tag "$IMAGE_NEW" "$IMAGE_LATEST"
            docker stop "$CONTAINER" >/dev/null 2>&1 || true
            docker rm "$CONTAINER" >/dev/null 2>&1 || true

            docker run -d \
              --name "$CONTAINER" \
              --restart always \
              --network "$NET" \
              --network-alias showdepremios \
              -v "$STORAGE_DIR:/var/www/html/showdepremios/storage" \
              "$IMAGE_LATEST"

            echo 'Recarregando Caddy...'
            docker exec "$PROXY_CONTAINER" caddy reload --config /etc/caddy/Caddyfile || true

            echo 'Validando URL pública...'
            ONLINE=0
            for i in $(seq 1 12); do
              if curl --fail --silent --show-error --location --max-time 15 https://showdepremios.mskpoeira.com.br/ >/dev/null; then
                ONLINE=1
                break
              fi
              echo "Tentativa $i/12..."
              sleep 4
            done

            if [ "$ONLINE" -eq 1 ]; then
              echo 'SHOW DE PRÊMIOS ONLINE.'
              docker image rm "$IMAGE_ROLLBACK" >/dev/null 2>&1 || true
              exit 0
            fi

            echo 'Nova versão não respondeu externamente. Iniciando rollback...'
            docker logs --tail 150 "$CONTAINER" || true
            docker rm -f "$CONTAINER" || true

            if docker image inspect "$IMAGE_ROLLBACK" >/dev/null 2>&1; then
              docker run -d \
                --name "$CONTAINER" \
                --restart always \
                --network "$NET" \
                --network-alias showdepremios \
                -v "$STORAGE_DIR:/var/www/html/showdepremios/storage" \
                "$IMAGE_ROLLBACK"
              docker exec "$PROXY_CONTAINER" caddy reload --config /etc/caddy/Caddyfile || true
              echo 'Rollback executado.'
            else
              echo 'Não existe imagem anterior disponível para rollback.'
            fi
            exit 1
