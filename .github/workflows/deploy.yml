name: Deploy Show de Prêmios para Produção

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy-showdepremios:
    name: Deploy Show de Prêmios (Hostinger VPS - Isolado)
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Validar sintaxe PHP
        run: |
          find app database -name "*.php" -exec php -l {} +
          php -l index.php

      - name: Criar pacote de release isolado
        run: |
          mkdir -p showdepremios_release
          rsync -av --exclude 'storage/' --exclude '.git/' --exclude '.github/' --exclude '.env' ./ showdepremios_release/
          tar -czf release-showdepremios.tar.gz -C showdepremios_release .
          rm -rf showdepremios_release

      - name: Transferir release para o servidor
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.HOSTINGER_IP || '77.37.40.81' }}
          username: ${{ secrets.HOSTINGER_USER || 'root' }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          timeout: "120s"
          command_timeout: "10m"
          source: "release-showdepremios.tar.gz"
          target: "/tmp"
          overwrite: true

      - name: Instalar e rodar Show de Prêmios isolado no VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOSTINGER_IP || '77.37.40.81' }}
          username: ${{ secrets.HOSTINGER_USER || 'root' }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: "20m"
          timeout: "120s"
          script: |
            set -e
            echo '=================================================='
            echo 'CONFIGURANDO DIRETÓRIO ISOLADO: /app/show-de-premios'
            echo '=================================================='
            mkdir -p /app/show-de-premios
            mv -f /tmp/release-showdepremios.tar.gz /app/show-de-premios/
            cd /app/show-de-premios

            echo 'Extraindo arquivos do release...'
            tar -xzf release-showdepremios.tar.gz
            rm -f release-showdepremios.tar.gz

            # Garantir diretorios de storage locais e exclusivos
            mkdir -p storage/logs storage/backups
            chmod -R 775 storage
            chown -R 33:33 storage || true

            echo 'Construindo imagem Docker exclusiva showdepremios...'
            docker build -t showdepremios-app:latest .

            echo 'Atualizando container showdepremios-app...'
            docker stop showdepremios-app || true
            docker rm showdepremios-app || true

            # Detecta a rede Docker do proxy Caddy para manter conectividade
            NET=$(docker network ls --format '{{.Name}}' | grep -E 'sgr_default|app_default|bridge' | head -n 1)
            if [ -z "$NET" ]; then
              NET="bridge"
            fi
            echo "Conectando container na rede Docker: $NET"

            docker run -d \
              --name showdepremios-app \
              --restart always \
              --network "$NET" \
              --network-alias showdepremios \
              -v /app/show-de-premios/storage:/var/www/html/showdepremios/storage \
              showdepremios-app:latest

            echo 'Garantindo recarregamento de rotas do Caddy...'
            if docker ps --format '{{.Names}}' | grep -q sgr-proxy-prod; then
              docker exec sgr-proxy-prod caddy reload --config /etc/caddy/Caddyfile || true
            elif systemctl is-active --quiet caddy; then
              systemctl reload caddy || true
            fi

            echo 'Aguardando estabilização do container...'
            sleep 8

            echo 'Validando serviço online em https://showdepremios.mskpoeira.com.br...'
            for i in {1..12}; do
              if curl --fail --silent --show-error --location --max-time 15 https://showdepremios.mskpoeira.com.br/ > /dev/null; then
                echo 'Show de Prêmios ONLINE com sucesso no diretório isolado /app/show-de-premios!'
                exit 0
              fi
              echo "Tentativa \$i/12..."
              sleep 4
            done

            echo 'Falha ao responder https://showdepremios.mskpoeira.com.br/'
            docker logs --tail 100 showdepremios-app || true
            exit 1
