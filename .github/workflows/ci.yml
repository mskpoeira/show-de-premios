name: CI

on:
  push:
    branches:
      - "fix/**"
      - "feature/**"
  pull_request:
    branches:
      - main

jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo
          tools: composer

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Optimize autoload
        run: composer dump-autoload --optimize --strict-psr

      - name: Lint PHP files
        run: php -l $(git ls-files "*.php")

      - name: Autoload smoke test
        run: php -r "require 'vendor/autoload.php'; foreach (['App\\', 'Database\\'] as $ns) { echo \"Testing $ns\n\"; }"

      - name: Run PHPUnit
        run: vendor/bin/phpunit --no-coverage

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --level=7

      - name: Build Docker image
        run: docker build -t show-de-premios .
