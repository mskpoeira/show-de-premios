name: CI

on:
  push:
    branches:
      - main
      - homologacao
      - "fix/**"
      - "feature/**"
      - "release/**"
  pull_request:
    branches:
      - main
      - homologacao

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Validate application version
        shell: bash
        run: |
          set -euo pipefail
          VERSION_VALUE="$(tr -d '\r\n ' < VERSION)"
          if ! printf '%s' "$VERSION_VALUE" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'; then
            echo "VERSION inválida: $VERSION_VALUE"
            exit 1
          fi
          grep -q "VERSION" app/Views/layouts/main.php
          grep -q 'appVersion' app/Views/layouts/main.php
          echo "Versão Web validada: $VERSION_VALUE"

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_sqlite, pdo_mysql, pdo_pgsql
          tools: composer

      - name: Validate Composer files
        run: composer validate --strict

      - name: Install dependencies from lock file
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Audit dependencies
        run: composer audit --no-interaction

      - name: Optimize autoload
        run: composer dump-autoload --optimize --strict-psr

      - name: Lint PHP files
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            php -l "$file"
          done < <(git ls-files '*.php')

      - name: Autoload smoke test
        run: |
          php -r 'require "vendor/autoload.php"; foreach (["App\\Core\\Auth","App\\Core\\Router","App\\Core\\Database","App\\Services\\PricingService","Database\\Migrations"] as $class) { if (!class_exists($class)) { fwrite(STDERR, "Autoload failed: ".$class.PHP_EOL); exit(1); } } echo "Autoload OK".PHP_EOL;'

      - name: Run PHPUnit
        run: vendor/bin/phpunit -c phpunit.xml --no-coverage

      - name: Run PHPStan level 7 debt audit
        continue-on-error: true
        run: |
          echo "PHPStan nível 7 permanece visível como auditoria de dívida técnica legada; lint, testes, dependências e Docker continuam bloqueantes."
          vendor/bin/phpstan analyse app database index.php --level=7 --no-progress --error-format=github

      - name: Build Docker image
        run: docker build -t show-de-premios:${{ github.sha }} .
