name: Deploy Presenca Anonima

on:
  push:
    branches: [main]
    paths:
      - "presenca-anonima/**"
      - ".github/workflows/deploy-presenca-anonima.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: presenca-anonima-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy presenca.mskpoeira.com.br
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v5

      - name: Criar pacote
        shell: bash
        run: |
          set -euo pipefail
          tar -czf release-presenca-anonima.tar.gz -C presenca-anonima .

      - name: Transferir release
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.HOSTINGER_IP || '77.37.40.81' }}
          username: ${{ secrets.HOSTINGER_USER || 'root' }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          timeout: "120s"
          command_timeout: "10m"
          source: "release-presenca-anonima.tar.gz"
          target: "/tmp"
          overwrite: true

      - name: Publicar no VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOSTINGER_IP || '77.37.40.81' }}
          username: ${{ secrets.HOSTINGER_USER || 'root' }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          timeout: "120s"
          command_timeout: "20m"
          script: |
            set -eu

            APP_DIR=/app/presenca-anonima
            STORAGE_DIR="$APP_DIR/storage"
            CONTAINER=presenca-anonima
            IMAGE=presenca-anonima:latest
            PROXY_CONTAINER=sgr-proxy-prod

            mkdir -p "$APP_DIR" "$STORAGE_DIR"
            mv -f /tmp/release-presenca-anonima.tar.gz "$APP_DIR/"
            cd "$APP_DIR"
            tar -xzf release-presenca-anonima.tar.gz
            rm -f release-presenca-anonima.tar.gz
            chmod 770 "$STORAGE_DIR"

            NET=$(docker inspect -f '{{range $name, $cfg := .NetworkSettings.Networks}}{{println $name}}{{end}}' "$PROXY_CONTAINER" 2>/dev/null | grep -Ev '^(bridge|host|none)$' | head -n 1 || true)
            test -n "$NET" || { echo "Rede do proxy não encontrada."; exit 1; }

            docker build -t "$IMAGE" .
            docker rm -f "$CONTAINER" >/dev/null 2>&1 || true

            docker run -d               --name "$CONTAINER"               --restart always               --network "$NET"               --network-alias presenca-anonima               -e PRESENCA_STORAGE=/var/www/storage               -v "$STORAGE_DIR:/var/www/storage"               "$IMAGE"

            CADDY_FILE=$(docker inspect "$PROXY_CONTAINER" --format '{{range .Mounts}}{{if eq .Destination "/etc/caddy/Caddyfile"}}{{.Source}}{{end}}{{end}}')
            test -n "$CADDY_FILE" || { echo "Caddyfile do proxy não localizado."; exit 1; }

            if ! grep -q '^presenca\.mskpoeira\.com\.br' "$CADDY_FILE"; then
              cp "$CADDY_FILE" "$CADDY_FILE.bak-presenca-$(date +%Y%m%d%H%M%S)"
              cat >> "$CADDY_FILE" <<'EOF'

            presenca.mskpoeira.com.br {
                header {
                    Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"
                    X-Content-Type-Options "nosniff"
                    X-Frame-Options "DENY"
                    Referrer-Policy "no-referrer"
                    Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
                    -Server
                }
                encode zstd gzip
                reverse_proxy presenca-anonima:80
            }
            EOF
            fi

            docker exec "$PROXY_CONTAINER" caddy validate --config /etc/caddy/Caddyfile
            docker exec "$PROXY_CONTAINER" caddy reload --config /etc/caddy/Caddyfile

            for i in $(seq 1 15); do
              if curl --fail --silent --show-error --location --max-time 15 https://presenca.mskpoeira.com.br/ >/dev/null; then
                echo "PRESENCA ONLINE."
                exit 0
              fi
              echo "Tentativa $i/15..."
              sleep 4
            done

            docker logs --tail 100 "$CONTAINER" || true
            exit 1
