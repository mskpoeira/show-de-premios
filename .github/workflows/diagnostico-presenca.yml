name: Diagnostico Presenca

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnostico-presenca.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnosticar VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOSTINGER_IP || '77.37.40.81' }}
          username: ${{ secrets.HOSTINGER_USER || 'root' }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          timeout: "120s"
          command_timeout: "10m"
          script: |
            set +e
            echo "=== DNS no servidor ==="
            getent hosts presenca.mskpoeira.com.br || true
            echo "=== Container ==="
            docker ps --filter name=presenca-anonima --format 'table {{.Names}}\t{{.Status}}\t{{.Networks}}'
            echo "=== Rota Caddy ==="
            CADDY_FILE=$(docker inspect sgr-proxy-prod --format '{{range .Mounts}}{{if eq .Destination "/etc/caddy/Caddyfile"}}{{.Source}}{{end}}{{end}}')
            grep -A18 -B2 'presenca.mskpoeira.com.br' "$CADDY_FILE" || true
            echo "=== Logs Caddy ==="
            docker logs --since 15m sgr-proxy-prod 2>&1 | tail -n 250 || true
            echo "=== Teste upstream ==="
            docker exec sgr-proxy-prod wget -qO- http://presenca-anonima:80/ | head -c 300 || true
            echo
            echo "=== Teste TLS ==="
            curl -vk --max-time 20 https://presenca.mskpoeira.com.br/ 2>&1 | tail -n 80 || true
